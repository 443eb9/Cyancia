name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just setup-rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-deps
          save-if: false

      - run: just setup-ci

      - run: just check

      - run: just test

      - run: just package dev

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ runner.os }}-${{ runner.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            target/package/*.zip
            target/package/*.tar.gz
            target/package/*.sha256
            target/package/*.debug
            target/package/*.pdb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Replace rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No nightly files found" >&2
            exit 1
          fi
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly" \
            --notes "Automated daily build. May be broken at any time."
          gh release upload nightly "${files[@]}"
